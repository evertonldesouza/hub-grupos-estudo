name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub_user
          POSTGRES_PASSWORD: hub_pass
          POSTGRES_DB: hub_grupos_estudo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub_user -d hub_grupos_estudo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HubGruposEstudo.slnx

      - name: Build
        run: dotnet build HubGruposEstudo.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/HubGruposEstudo.UnitTests
          --configuration Release
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore
          retention-days: 7
