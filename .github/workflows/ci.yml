name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HubGruposEstudo.slnx

      - name: Build
        run: dotnet build HubGruposEstudo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HubGruposEstudo.UnitTests --configuration Release --no-build --verbosity normal
