name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub_user
          POSTGRES_PASSWORD: hub_pass
          POSTGRES_DB: hub_grupos_estudo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub_user -d hub_grupos_estudo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HubGruposEstudo.slnx

      - name: Build
        run: dotnet build HubGruposEstudo.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          set +e
          dotnet test tests/HubGruposEstudo.UnitTests --configuration Release --no-build --verbosity detailed 2>&1 | tee "$RUNNER_TEMP/test-output.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=dotnet test::$line"
            done < <(tail -n 120 "$RUNNER_TEMP/test-output.log")
          fi
          exit "$test_status"
